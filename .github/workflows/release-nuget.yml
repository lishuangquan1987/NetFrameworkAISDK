name: Release NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (e.g., 1.2.3)"
        required: true
        type: string

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The SDK version comes from global.json so CI and local builds use the same
      # toolchain. Without a global.json the runner silently picks the newest SDK
      # on the image (it used 10.0.401 when Restore broke), so image updates could
      # change the compiler/restore stack under us without any repo change.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Show toolchain
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet nuget list source

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.nuspec', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $trigger = "${{ github.event_name }}"
          if ($trigger -eq "release")
          {
            $raw = "${{ github.event.release.tag_name }}"
          }
          else
          {
            $raw = "${{ github.event.inputs.version }}"
          }

          # Tags look like 'v0.1.6', and manual runs may type the same, so strip
          # the prefix to get a valid NuGet version.
          #
          # The variable must NOT be called VERSION: MSBuild imports environment
          # variables as build properties, so VERSION would override the
          # project's Version property and restore dies with
          # "'v0.1.6' is not a valid version string" (surfacing as the opaque
          # MSB4181 "RestoreTask returned false but did not log an error").
          $version = $raw.Trim() -replace '^[vV]', ''
          if ($version -notmatch '^\d+(\.\d+){2,3}(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$')
          {
            Write-Host "::error::Invalid version '$raw'. Provide a version like 1.2.3 or v1.2.3."
            exit 1
          }

          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Extracted version: $version"

      # -bl writes a binary log: MSB4181 ("RestoreTask returned false but did not
      # log an error") means NuGet swallowed the real error, and the binlog keeps
      # the full detail for the diagnostics artifact.
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/NetFrameworkAISDK/NetFrameworkAISDK.csproj --verbosity normal -bl:restore.binlog
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::Restore failed; retrying once (possible transient feed/network failure)"
            dotnet restore src/NetFrameworkAISDK/NetFrameworkAISDK.csproj --verbosity normal -bl:restore-retry.binlog
            exit $LASTEXITCODE
          }

      - name: Build (net40 + netstandard2.0)
        run: dotnet build src/NetFrameworkAISDK/NetFrameworkAISDK.csproj -c Release --no-restore -bl:build.binlog

      - name: Create NuGet package
        run: |
          nuget pack src\NetFrameworkAISDK\NetFrameworkAISDK.nuspec `
            -Version $env:PACKAGE_VERSION `
            -Properties Configuration=Release `
            -OutputDirectory .\nupkg

      - name: Push package to NuGet.org
        run: |
          nuget push .\nupkg\NetFrameworkAISDK.$env:PACKAGE_VERSION.nupkg `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ secrets.NUGET_API_KEY }}

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-diagnostics
          path: |
            restore.binlog
            restore-retry.binlog
            build.binlog
          if-no-files-found: ignore
