name: Release NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install .NET Framework 4.0 Reference Assemblies
        shell: pwsh
        run: |
          Write-Host "Downloading .NET Framework 4.0 reference assemblies..."
          nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -Version 1.0.3 -OutputDirectory packages
          $refDir = (Resolve-Path "packages\Microsoft.NETFramework.ReferenceAssemblies.net40.1.0.3\build\.NETFramework\v4.0\").Path
          Write-Host "Reference assemblies path: $refDir"
          echo "FRAMEWORK_PATH_OVERRIDE=$refDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $trigger = "${{ github.event_name }}"
          if ($trigger -eq "release")
          {
            $tag = "${{ github.event.release.tag_name }}"
            $version = $tag -replace '^v', ''
          }
          else
          {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          echo "Extracted version: $version"

      - name: Restore NuGet packages
        run: nuget restore NetFrameworkAISDK.sln

      - name: Build solution (Release)
        run: msbuild NetFrameworkAISDK.sln /t:Rebuild /p:Configuration=Release /p:FrameworkPathOverride="$env:FRAMEWORK_PATH_OVERRIDE"

      - name: Create NuGet package
        run: |
          nuget pack src\NetFrameworkAISDK\NetFrameworkAISDK.nuspec `
            -Version $env:VERSION `
            -Properties Configuration=Release `
            -OutputDirectory .\nupkg

      - name: Push package to NuGet.org
        run: |
          nuget push .\nupkg\NetFrameworkAISDK.$env:VERSION.nupkg `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ secrets.NUGET_API_KEY }}