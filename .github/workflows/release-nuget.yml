name: Release NuGet Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "NuGet package version (e.g., 1.2.3)"
        required: true
        type: string

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Extract version
        id: get_version
        shell: pwsh
        run: |
          $trigger = "${{ github.event_name }}"
          if ($trigger -eq "release")
          {
            $tag = "${{ github.event.release.tag_name }}"
            $version = $tag -replace '^v', ''
          }
          else
          {
            $version = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          Write-Host "Extracted version: $version"

      - name: Restore
        run: dotnet restore src/NetFrameworkAISDK/NetFrameworkAISDK.csproj

      - name: Build (net40 + netstandard2.0)
        run: dotnet build src/NetFrameworkAISDK/NetFrameworkAISDK.csproj -c Release --no-restore

      - name: Create NuGet package
        run: |
          nuget pack src\NetFrameworkAISDK\NetFrameworkAISDK.nuspec `
            -Version $env:VERSION `
            -Properties Configuration=Release `
            -OutputDirectory .\nupkg

      - name: Push package to NuGet.org
        run: |
          nuget push .\nupkg\NetFrameworkAISDK.$env:VERSION.nupkg `
            -Source https://api.nuget.org/v3/index.json `
            -ApiKey ${{ secrets.NUGET_API_KEY }}
